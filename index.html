    <meta name="theme-color" content="#f4f3ee" />
    <script>
      // Stored choice wins; otherwise the page follows the sun over Helsinki
      // (same Spencer formula as src/lib/helsinkiSolar.ts, dusk at -4 degrees).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("chaonav-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          var d = new Date();
          var rad = Math.PI / 180;
          var year = d.getUTCFullYear();
          var day = Math.floor(
            (Date.UTC(year, d.getUTCMonth(), d.getUTCDate()) -
              Date.UTC(year, 0, 0)) /
              864e5,
          );
          var min = d.getUTCHours() * 60 + d.getUTCMinutes();
          var g = ((2 * Math.PI) / 365) * (day - 1 + (min / 60 - 12) / 24);
          var eq =
            229.18 *
            (0.000075 +
              0.001868 * Math.cos(g) -
              0.032077 * Math.sin(g) -
              0.014615 * Math.cos(2 * g) -
              0.040849 * Math.sin(2 * g));
          var dec =
            0.006918 -
            0.399912 * Math.cos(g) +
            0.070257 * Math.sin(g) -
            0.006758 * Math.cos(2 * g) +
            0.000907 * Math.sin(2 * g) -
            0.002697 * Math.cos(3 * g) +
            0.00148 * Math.sin(3 * g);
          var hour = ((min + eq + 4 * 24.9384) / 4 - 180) * rad;
          var lat = 60.1699 * rad;
          var alt =
            Math.asin(
              Math.sin(lat) * Math.sin(dec) +
                Math.cos(lat) * Math.cos(dec) * Math.cos(hour),
            ) / rad;
          theme = alt > -4 ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "light" ? "#f4f3ee" : "#0a0e2a");
        }
      })();
    </script>
